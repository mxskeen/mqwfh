[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

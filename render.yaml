services:
  - type: web
    name: mqwfh-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: data/elexon_wind.db
      - key: OPENROUTER_API_KEY
        sync: false

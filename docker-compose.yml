services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: power-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_PATH=/app/data/elexon_wind.db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reint-power-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
